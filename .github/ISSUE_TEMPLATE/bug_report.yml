name: Bug / 使用问题
description: 报告可复现的错误、回归或运行问题
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除凭据、真实船舶身份和未获授权的数据。
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和文档。
          required: true
        - label: 我确认这不是在真实船舶上部署或使用的问题。
          required: true
  - type: input
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 / commit SHA
    validations:
      required: true
  - type: input
    attributes:
      label: 运行环境
      placeholder: macOS 15, Godot 4.7, Python 3.10
    validations:
      required: true
  - type: textarea
    attributes:
      label: 最小复现步骤
      description: 请提供从干净环境开始的最少步骤。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果与日志
      description: 请粘贴完整但已脱敏的日志，不要只上传截图。
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 可附截图、最小配置或与数据来源有关的说明。

name: RL data pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rl-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-rl.txt
      - name: Install the reproducible RL runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-rl.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run environment, split, controller, data and evidence tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild the fixed scenarios from the bundled public hourly data
        run: python tools/build_public_navigation_benchmark.py
      - name: Verify fixed benchmark hashes and release evidence
        run: |
          python tools/run_navigation_benchmark.py verify
          python tools/validate_port_package.py \
            data/rl/long_beach_ais_port_ops_benchmark_v2.json \
            --require-research-ready
          python tools/run_port_ops_benchmark.py verify
          python tools/run_safety_supervisor_benchmark.py verify
          python tools/audit_safety_supervisor_utility_v3.py verify
          python tools/run_maritime_assurance.py verify
          make PYTHON=python reliability-audit
          python tools/release_check.py
          python tools/build_research_core_release.py build

name: Feature request / 功能建议
description: 提议新算法、数据接口、仿真能力或体验改进
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    attributes:
      label: 要解决的问题
      description: 请描述用户场景和当前限制，而不只是给出实现方案。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 主要范围
      options:
        - Godot 仿真与 UI
        - 强化学习或控制算法
        - 数据契约与适配器
        - 测试、复现与工具链
        - 文档与社区
    validations:
      required: true
  - type: textarea
    attributes:
      label: 真实性、兼容性与许可影响
      description: 说明是否影响实验指纹、数据 split、第三方依赖/资产或安全边界。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 验收标准
      description: 给出可测试、可观察的完成条件。
    validations:
      required: true

name: RL data pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rl-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the reproducible RL runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-rl.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run environment, split, controller and AIS tests
        run: python -m unittest tests.test_ship_rl -v

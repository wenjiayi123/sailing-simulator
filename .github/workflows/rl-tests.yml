name: RL data pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the reproducible RL runtime
        run: python -m pip install -r requirements-rl.txt
      - name: Run environment, split, controller and AIS tests
        run: python -m unittest tests.test_ship_rl -v
